executor: slurm
jobs: 30
configfile: profiles/explorer/platform.yaml
software-deployment-method: apptainer
apptainer-prefix: /courses/BINF6610.202710/shared/snakemake-images
apptainer-args: "--bind /courses,/scratch,/tmp"
latency-wait: 60
printshellcmds: true

default-resources:
  slurm_account: binf6610.202710
  slurm_partition: courses
  runtime: 30
  mem_mb: 2000

set-resources:
  fastqc:
    mem_mb: 8000
  fastp_paired:
    mem_mb: 8000
  fastp_single:
    mem_mb: 8000
  bwa_mem:
    mem_mb: 8000
    runtime: 60
  markduplicates:
    mem_mb: 8000
  haplotypecaller:
    mem_mb: 24000
    runtime: 60
  joint_genotype:
    mem_mb: 24000
    runtime: 120
  filter:
    mem_mb: 8000
  multiqc:
    mem_mb: 8000
